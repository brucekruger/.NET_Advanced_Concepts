# GitLab CI/CD Pipeline for .NET 10 Microservices
# Project: 09.CI-CD (Catalog & Cart Services)
# Platform: .NET 10, Docker, Docker Compose, Terraform
# Branching: GitLab Flow (feature/* → master via MR)

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: 1
  # .NET SDK image for build & test
  DOTNET_SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0
  # .NET runtime image for final containers
  DOTNET_RUNTIME_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0
  # Service images
  MSSQL_IMAGE: mcr.microsoft.com/mssql/server:2022-latest
  REDIS_IMAGE: redis:7-alpine
  RABBITMQ_IMAGE: rabbitmq:3-management-alpine
  KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:latest

  # Docker Registry (GitLab Container Registry)
  REGISTRY: $CI_REGISTRY
  REGISTRY_IMAGE: $CI_REGISTRY_IMAGE

stages:
  - .pre
  - build
  - test
  - package
  - infra
  - deploy

# ============================================================================
# MERGE REQUEST PIPELINES (on: [merge_request_event])
# ============================================================================

# ==== BUILD ====

build:catalog:
  stage: build
  image: $DOTNET_SDK_IMAGE
  only:
    - merge_requests
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_request"'
      changes:
        - 'CatalogService.*/**'
        - '*.sln'
        - '.gitlab-ci.yml'
        - 'ci/**'
  script:
    - echo "Building CatalogService..."
    - dotnet restore 09.CI-CD.sln
    - dotnet build 09.CI-CD.sln -c Release --no-restore
  cache:
    key: catalog-build-$CI_COMMIT_REF_SLUG
    paths:
      - .nuget/

build:cart:
  stage: build
  image: $DOTNET_SDK_IMAGE
  only:
    - merge_requests
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_request"'
      changes:
        - 'CartService*/**'
        - '*.sln'
        - '.gitlab-ci.yml'
        - 'ci/**'
  script:
    - echo "Building CartService..."
    - dotnet restore 09.CI-CD.sln
    - dotnet build 09.CI-CD.sln -c Release --no-restore
  cache:
    key: cart-build-$CI_COMMIT_REF_SLUG
    paths:
      - .nuget/

# ==== TEST ====

test:catalog:
  stage: test
  image: $DOTNET_SDK_IMAGE
  only:
    - merge_requests
  needs:
    - build:catalog
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_request"'
      changes:
        - 'CatalogService*/**'
        - '*.sln'
        - '.gitlab-ci.yml'
        - 'ci/**'
  script:
    - echo "Running CatalogService tests..."
    - dotnet test CatalogService.UnitTests/CatalogService.UnitTests.csproj -c Release --no-build --logger "junit;LogFilePath=test-results/unit-test-results.xml"
    - dotnet test CatalogService.IntegrationTests/CatalogService.IntegrationTests.csproj -c Release --no-build --logger "junit;LogFilePath=test-results/integration-test-results.xml" || true
  artifacts:
    reports:
      junit: test-results/**/*-test-results.xml
    paths:
      - test-results/
    expire_in: 1 week
  cache:
    key: catalog-build-$CI_COMMIT_REF_SLUG
    paths:
      - .nuget/

test:cart:
  stage: test
  image: $DOTNET_SDK_IMAGE
  only:
    - merge_requests
  needs:
    - build:cart
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_request"'
      changes:
        - 'CartService*/**'
        - '*.sln'
        - '.gitlab-ci.yml'
        - 'ci/**'
  script:
    - echo "Running CartService tests..."
    - dotnet test CartService.Tests/CartService.Tests.csproj -c Release --no-build --logger "junit;LogFilePath=test-results/test-results.xml"
  artifacts:
    reports:
      junit: test-results/**/*-test-results.xml
    paths:
      - test-results/
    expire_in: 1 week
  cache:
    key: cart-build-$CI_COMMIT_REF_SLUG
    paths:
      - .nuget/

# ==== INFRASTRUCTURE (Merge Request: Plan Only) ====

infra:plan:mr:
  stage: infra
  image: hashicorp/terraform:latest
  only:
    - merge_requests
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_request"'
      changes:
        - 'infra/**'
        - 'docker-compose.yml'
        - '.gitlab-ci.yml'
  script:
    - echo "Terraform plan (merge request)..."
    - cd infra
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - infra/tfplan
      - infra/.terraform/
    expire_in: 1 day

# ============================================================================
# PUSH / MERGE TO MASTER PIPELINES (on: [push, merge_request_event])
# ============================================================================

build:all:master:
  stage: build
  image: $DOTNET_SDK_IMAGE
  only:
    - master
  script:
    - echo "Building entire solution on master..."
    - dotnet restore 09.CI-CD.sln
    - dotnet build 09.CI-CD.sln -c Release --no-restore
  cache:
    key: master-build-$CI_COMMIT_SHA
    paths:
      - .nuget/

test:all:master:
  stage: test
  image: $DOTNET_SDK_IMAGE
  only:
    - master
  needs:
    - build:all:master
  script:
    - echo "Running all tests on master..."
    - dotnet test CatalogService.UnitTests/CatalogService.UnitTests.csproj -c Release --no-build --logger "junit;LogFilePath=test-results/catalog-unit-test-results.xml"
    - dotnet test CatalogService.IntegrationTests/CatalogService.IntegrationTests.csproj -c Release --no-build --logger "junit;LogFilePath=test-results/catalog-integration-test-results.xml" || true
    - dotnet test CartService.Tests/CartService.Tests.csproj -c Release --no-build --logger "junit;LogFilePath=test-results/cart-test-results.xml"
  artifacts:
    reports:
      junit: test-results/**/*-test-results.xml
    paths:
      - test-results/
    expire_in: 30 days
  cache:
    key: master-build-$CI_COMMIT_SHA
    paths:
      - .nuget/

package:docker:master:
  stage: package
  image: docker:latest
  only:
    - master
  needs:
    - test:all:master
  script:
    - echo "Building Docker images for CatalogService.Api and CartService.Api..."
    - docker build -t $REGISTRY_IMAGE/catalog-service:$CI_COMMIT_SHA -t $REGISTRY_IMAGE/catalog-service:latest -f CatalogService.Api/Dockerfile .
    - docker build -t $REGISTRY_IMAGE/cart-service:$CI_COMMIT_SHA -t $REGISTRY_IMAGE/cart-service:latest -f CartService.Api/Dockerfile .
    - echo "Docker images built successfully"
  artifacts:
    expire_in: 1 day

infra:apply:master:
  stage: infra
  image: hashicorp/terraform:latest
  only:
    - master
  script:
    - echo "Terraform apply (master branch)..."
    - cd infra
    - terraform init
    - terraform apply -auto-approve
  when: manual

deploy:docker-compose:master:
  stage: deploy
  image: docker:latest
  only:
    - master
  needs:
    - test:all:master
  script:
    - echo "Deploying services with Docker Compose..."
    - docker-compose -f docker-compose.yml up -d
    - sleep 5
    - echo "Running smoke tests against /health endpoints..."
    - docker run --network host curlimages/curl:latest curl -f http://localhost:5001/health || echo "Catalog health check - warn only"
    - docker run --network host curlimages/curl:latest curl -f http://localhost:5002/health || echo "Cart health check - warn only"
  when: manual

# ============================================================================
# UTILITIES
# ============================================================================

# Lint & validation (optional, runs on MR & master)
validate:gitlab-ci:
  stage: .pre
  image: alpine:latest
  script:
    - apk add --no-cache git curl
    - curl -o /usr/local/bin/gitlab-runner-helper https://gitlab.com/gitlab-org/gitlab-runner/-/raw/main/docs/scripts/ci/lint_ci.sh
    - echo "GitLab CI YAML syntax is valid (validated by GitLab server)"
  only:
    - merge_requests
    - master
  allow_failure: true
